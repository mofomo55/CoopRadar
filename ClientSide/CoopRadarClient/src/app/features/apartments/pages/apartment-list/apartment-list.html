
<header class="page-shell">
    <h1 class="page-title">Cooperative apartments</h1>
    <span>Search for current apartments from non-profit housing developers.</span>
</header>




<section>

  <aside class="filters-sidebar">
    <app-filter-sidebar [showSwitch]="false" [switchLabel]="'Show Filters'" [FilterBoxLabel]="'Filter Options'" [ButtonFilterText]="'Apply Filters'" >
    </app-filter-sidebar>
  </aside>
  
  <main class="content-List">
  @for (apartment of apartmentService.list(); track apartment.id) {
    <app-apartment-card [apartment]="apartment" />
  }
  </main>
</section>
