<header class="page-shell">
  <h1 class="page-title">About CoopRadar</h1>
  <span>All information about our Application</span>
</header>


<section class="page-content">
  <div class="information-grid">
    @for (box of informationBoxes; track box.title) {
      <app-information-box
        [title]="box.title"
        [text]="box.text"
        [iconPath]="box.iconPath"
        [actionLabel]="box.actionLabel"
        [actionLink]="box.actionLink"
        shape="card"
        width="100%"
        height="280px"
      ></app-information-box>
    }
  </div>
</section>
