<header class="page-shell">
  <h1 class="page-title">Support</h1>
  <span>Problems, feedback, or suggestions?</span>
</header>

<section class="page-shell page-content">
  <form class="contact-form" novalidate>
    <p class="intro-text">
      We value your opinion and are here to help. Whether you are experiencing technical
      difficulties, wish to offer suggestions for improvement, or simply want to provide
      feedback on our products and services – we are here for you
    </p>

    <div class="field-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Your name" />
    </div>

    <div class="field-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Your email" />
    </div>

    <div class="field-group">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" placeholder="Brief title" />
    </div>

    <div class="field-group large-field">
      <label for="message">Description</label>
      <textarea id="message" name="message" rows="7" placeholder="Tell us about the problem..."></textarea>
    </div>

    <button type="submit" class="send-button">Send</button>
  </form>
</section>
