<div class="image-upload-field" [ngStyle]="containerStyle">
  <div class="image-frame" [ngClass]="frameClasses" aria-label="{{ imageTitle }}">
    <img [src]="currentImage || defaultImagePath" [alt]="imageTitle" />

    <div class="image-actions" *ngIf="showUploadButton || showDeleteButton">
      <label
        *ngIf="showUploadButton"
        class="icon-button upload-button"
        [attr.aria-label]="'Upload ' + imageTitle"
      >
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 7.5A3.5 3.5 0 0 1 11.5 4h1A3.5 3.5 0 0 1 16 7.5V8h.5A2.5 2.5 0 0 1 19 10.5v7A2.5 2.5 0 0 1 16.5 20h-9A2.5 2.5 0 0 1 5 17.5v-7A2.5 2.5 0 0 1 7.5 8H8v-.5zm3 2.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 1.75a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5z" />
        </svg>
      </label>

      <button
        *ngIf="showDeleteButton"
        type="button"
        class="icon-button delete-button"
        (click)="resetToDefault()"
        [attr.aria-label]="'Delete ' + imageTitle"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 6h10l1 2H6l1-2zm-2 3h14l-1 11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 9zm5-3V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1m-4 6v5m4-5v5" />
        </svg>
      </button>
    </div>
  </div>
</div>
