<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradient definition matching the App primary blue -->
    <linearGradient id="coopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0040A8"/>
    </linearGradient>
    
    <!-- Soft Drop Shadow for Figma UI style -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0040A8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- LOGO ICON (House + Radar Sweep Integration) -->
  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- Base House Roof & Walls -->
    <path d="M 50 12 L 14 44 C 11 46.5 11 50.5 14 53 L 18 56.5 C 20 58.2 23 58 25 56 L 50 34 L 75 56 C 77 58 80 58.2 82 56.5 L 86 53 C 89 50.5 89 46.5 86 44 L 50 12 Z" fill="url(#coopGrad)" />
    
    <!-- Main House Body -->
    <path d="M 24 54 V 82 C 24 86.4 27.6 90 32 90 H 68 C 72.4 90 76 86.4 76 82 V 54 L 50 31 L 24 54 Z" fill="none" stroke="url(#coopGrad)" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Central Door / Target Node -->
    <path d="M 43 90 V 68 C 43 64.1 46.1 61 50 61 C 53.9 61 57 64.1 57 68 V 90" fill="none" stroke="url(#coopGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Inner Radar Wave (Pulse 1) -->
    <path d="M 33 42 A 22 22 0 0 1 67 42" fill="none" stroke="url(#coopGrad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Outer Radar Wave (Pulse 2) -->
    <path d="M 24 33 A 34 34 0 0 1 76 33" fill="none" stroke="url(#coopGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Radar Sweep Center Point -->
    <circle cx="50" cy="48" r="4" fill="url(#coopGrad)"/>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(125, 76)">
    <!-- "Coop" in Bold Modern Sans-Serif -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-1">Coop</text>
    
    <!-- "Radar" in Primary Brand Blue -->
    <text x="114" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="46" font-weight="400" fill="#0066FF" letter-spacing="-0.5">Radar</text>
    
    <!-- Subtitle / Tagline -->
    <text x="3" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="2.5" text-transform="uppercase">Cooperative Housing Finder</text>
  </g>
</svg>
